name: mirai-sample

# Rules (MIRAI unit 02): only the app's own source folders are mounted; never .git, the
# home folder or the Docker socket. Ports listen on localhost only.

services:
  app:
    image: mirai-sample/app:dev
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      # "testing" in MIRAI test runs (.env.test): the app then uses the committed
      # backend/.env.testing, since a test run has no real .env.
      APP_ENV: ${APP_ENV:-local}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks: [sample]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8100:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [sample]

  frontend:
    image: mirai-sample/frontend:dev
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8180/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [sample]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sample
      MYSQL_USER: sample
      MYSQL_PASSWORD: sample-db-password
      MYSQL_ROOT_PASSWORD: sample-root-password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usample", "-psample-db-password"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [sample]

  # Browser tests, run on demand: docker compose run --rm playwright
  playwright:
    image: mirai-sample/e2e:dev
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    profiles: [e2e]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules
    environment:
      BASE_URL: http://frontend:8180
      E2E_EMAIL: demo@example.test
      # Must match DEMO_USER_PASSWORD in backend/.env.example and .env.testing.
      E2E_PASSWORD: demo-password
    depends_on:
      frontend:
        condition: service_healthy
    networks: [sample]

volumes:
  backend_vendor:
  frontend_node_modules:
  mysql_data:

networks:
  sample:
