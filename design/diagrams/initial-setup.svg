<tspan x="510.0" dy="18.75">keep · rewrite · move</tspan>
<tspan x="510.0" dy="18.75">· automate · delete</tspan>
</text>
<rect x="700" y="440" width="240" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="820.0" y="472.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="820.0" dy="0">Interview the gaps</tspan>
<tspan x="820.0" dy="18.75">one question + a guess</tspan>
<tspan x="820.0" dy="18.75">where docs live · repos</tspan>
<tspan x="820.0" dy="18.75">· resources · tdd/tests</tspan>
</text>
<rect x="1010" y="440" width="240" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="1130.0" y="472.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="1130.0" dy="0">Business context</tspan>
<tspan x="1130.0" dy="18.75">from your sources</tspan>
<tspan x="1130.0" dy="18.75">(files, links, text)</tspan>
<tspan x="1130.0" dy="18.75">+ critical journeys</tspan>
</text>
<rect x="1320" y="440" width="240" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1440.0" y="472.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="1440.0" dy="0">Test levels + baseline</tspan>
<tspan x="1440.0" dy="18.75">known failures recorded</tspan>
<tspan x="1440.0" dy="18.75">· gaps reported,</tspan>
<tspan x="1440.0" dy="18.75">not fixed</tspan>
</text>
<rect x="1630" y="440" width="240" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1750.0" y="472.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
