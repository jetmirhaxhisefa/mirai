<tspan x="2710.0" dy="0">mirai doctor</tspan>
<tspan x="2710.0" dy="18.75">install · hooks · CI or local-only</tspan>
<tspan x="2710.0" dy="18.75">· integration branch</tspan>
<tspan x="2710.0" dy="18.75">· red-team suite: must pass</tspan>
<tspan x="2710.0" dy="18.75">before any headless run</tspan>
</text>
<polyline points="2690.0,575 2710.0,670" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m0)"/>
<rect x="40" y="890" width="1260" height="560" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="56" y="926" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
<tspan x="56" dy="0">3 · What ends up where</tspan>
</text>
<rect x="80" y="980" width="1180" height="460" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="670.0" y="1084.0" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="670.0" dy="0">IN THE PROJECT (committed)</tspan>
<tspan x="670.0" dy="18.75">.mirai/framework/  — pinned MIRAI copy</tspan>
<tspan x="670.0" dy="18.75">.mirai/mirai.lock  — version + file hashes</tspan>
<tspan x="670.0" dy="18.75">.mirai/config.toml  — integration_branch · repos · resources</tspan>
<tspan x="670.0" dy="18.75">      · test levels · named checks · tdd/tests · tiers · gates</tspan>
<tspan x="670.0" dy="18.75">.mirai/custom/  — overrides  ·  .mirai/context/  — business, feature map</tspan>
<tspan x="670.0" dy="18.75">signed approvals + proofs · branch.json · handover.json · public key</tspan>
<tspan x="670.0" dy="18.75">docs/…  — PRD · HLD · ADR · LLD · tickets (if in repo)</tspan>
<tspan x="670.0" dy="18.75">CLAUDE.md · AGENTS.md · .claude/  — generated   ·   .env.test  — dummy secrets</tspan>
<tspan x="670.0" dy="18.75"> </tspan>
<tspan x="670.0" dy="18.75">OUTSIDE THE PROJECT (never committed, agents can't read it)</tspan>
<tspan x="670.0" dy="18.75">~/Library/Application Support/mirai/&lt;repo-id&gt;/</tspan>
<tspan x="670.0" dy="18.75">      store (runs, rounds, status, reviews, QA) · trust root</tspan>
<tspan x="670.0" dy="18.75">      · git hooks · broker · reports · config.user.toml</tspan>
<tspan x="670.0" dy="18.75">~/.config/mirai/  — signing key</tspan>
</text>
<rect x="1320" y="890" width="1260" height="560" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="1336" y="926" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
