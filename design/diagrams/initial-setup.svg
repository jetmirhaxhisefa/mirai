<text x="80" y="-160" font-size="40" fill="#1e1e1e" text-anchor="start" font-weight="bold">
<tspan x="80" dy="0">MIRAI — installing it into a project  (design v5, approved)</tspan>
</text>
<text x="80" y="-122" font-size="18" fill="#495057" text-anchor="start">
<tspan x="80" dy="0">One command copies a pinned version. One setup skill fills in the project. Claude Code first; Codex as a verifier later; Cursor when needed. Project files never leave the project.</tspan>
</text>
<rect x="40" y="-90" width="1900" height="270" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="56" y="-54" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
<tspan x="56" dy="0">1 · Install (script, no AI)</tspan>
</text>
<rect x="80" y="40" width="240" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="200.0" y="81.5" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="200.0" dy="0">npx github:&lt;you&gt;/mirai</tspan>
<tspan x="200.0" dy="18.75">#vX.Y.Z init</tspan>
<tspan x="200.0" dy="18.75">pinned git tag</tspan>
</text>
<rect x="390" y="40" width="240" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="510.0" y="72.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="510.0" dy="0">Copy framework</tspan>
<tspan x="510.0" dy="18.75">.mirai/framework/ + mirai.lock</tspan>
<tspan x="510.0" dy="18.75">hashes; each file marked</tspan>
<tspan x="510.0" dy="18.75">framework/project/rendered</tspan>
</text>
<rect x="700" y="40" width="240" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="820.0" y="81.5" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="820.0" dy="0">Generate Claude Code</tspan>
<tspan x="820.0" dy="18.75">files + the strict</tspan>
<tspan x="820.0" dy="18.75">settings bundle</tspan>
</text>
<rect x="1010" y="40" width="240" height="110" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1130.0" y="72.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="1130.0" dy="0">Hooks in the trust root</tspan>
<tspan x="1130.0" dy="18.75">(MIRAI home) · Ed25519</tspan>
<tspan x="1130.0" dy="18.75">key pair · CI jobs:</tspan>
<tspan x="1130.0" dy="18.75">mirai-verify + tests</tspan>
</text>
<rect x="1320" y="40" width="240" height="110" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="1440.0" y="81.5" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="1440.0" dy="0">Next: run</tspan>
<tspan x="1440.0" dy="18.75">/mirai-setup</tspan>
<tspan x="1440.0" dy="18.75">in Claude Code</tspan>
</text>
