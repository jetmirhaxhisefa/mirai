</text>
<rect x="80" y="440" width="240" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="200.0" y="472.125" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="200.0" dy="0">Detect</tspan>
<tspan x="200.0" dy="18.75">stack · named checks ·</tspan>
<tspan x="200.0" dy="18.75">test levels · compose</tspan>
<tspan x="200.0" dy="18.75">mounts · branch pattern</tspan>
</text>
<rect x="390" y="440" width="240" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="510.0" y="481.5" font-size="15" fill="#1e1e1e" text-anchor="middle">
