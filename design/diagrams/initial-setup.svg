<tspan x="1750.0" dy="18.75">sandbox · deny rules ·</tspan>
<tspan x="1750.0" dy="18.75">hooks · MIRAI MCP broker</tspan>
<tspan x="1750.0" dy="18.75">(run_tests, no shell)</tspan>
</text>
<rect x="1940" y="440" width="240" height="110" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="2060.0" y="481.5" font-size="15" fill="#1e1e1e" text-anchor="middle">
<tspan x="2060.0" dy="0">Where each artifact</tspan>
<tspan x="2060.0" dy="18.75">type lives: ONE place</tspan>
<tspan x="2060.0" dy="18.75">(repo, or one tool)</tspan>
</text>
<rect x="2250" y="440" width="240" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="2370.0" y="481.5" font-size="15" fill="#1e1e1e" text-anchor="middle">
