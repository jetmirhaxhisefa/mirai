<tspan x="900.0" dy="0">Tess</tspan>
<tspan x="900.0" dy="20.0">ticket planner</tspan>
<tspan x="900.0" dy="20.0">epics · stories</tspan>
</text>
<rect x="1100" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="1240.0" y="740.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1240.0" dy="0">Kai</tspan>
<tspan x="1240.0" dy="20.0">developer</tspan>
<tspan x="1240.0" dy="20.0">plan · stub · TDD</tspan>
</text>
<rect x="1440" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="1580.0" y="740.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
