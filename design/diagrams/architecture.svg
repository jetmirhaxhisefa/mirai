<tspan x="1580.0" dy="20.0">reviewer</tspan>
<tspan x="1580.0" dy="20.0">code + E2E test</tspan>
</text>
<rect x="1780" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="1920.0" y="740.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1920.0" dy="0">Ivy</tspan>
<tspan x="1920.0" dy="20.0">QA</tspan>
<tspan x="1920.0" dy="20.0">writes E2E · evidence per AC</tspan>
</text>
<rect x="2120" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="2260.0" y="740.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="2260.0" dy="0">Vera</tspan>
<tspan x="2260.0" dy="20.0">verifier</tspan>
<tspan x="2260.0" dy="20.0">another model family</tspan>
</text>
<polyline points="860.0,400 1240.0,700" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m0)"/>
<polyline points="1580.0,700 1180.0,400" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#m2)"/>
<rect x="80" y="840" width="2400" height="110" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="1280.0" y="880.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1280.0" dy="0">Blocking layers (no container, no separate user — V1 = a):  1) Claude Code OS sandbox, no escape: home denied except project + caches · MIRAI home and .git not writable · network allowlist</tspan>
<tspan x="1280.0" dy="20.0">2) deny rules: git commit/push/config, gh, docker, claude, mirai; headless also WebFetch, WebSearch, Task   3) hooks from the trust root: secrets, Glob/Grep outside the project</tspan>
<tspan x="1280.0" dy="20.0">4) tests and checks only via the broker   5) protected paths (.claude/, .vscode/, .envrc, .husky/, package.json scripts, compose, .env*)   -&gt;  red-team suite green before any headless launch</tspan>
</text>
<rect x="40" y="1090" width="2500" height="330" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="56" y="1126" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
<tspan x="56" dy="0">Where things live</tspan>
</text>
<rect x="80" y="1180" width="320" height="140" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="240.0" y="1225.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="240.0" dy="0">Project branch (committed)</tspan>
<tspan x="240.0" dy="20.0">docs · tickets · .mirai/config</tspan>
<tspan x="240.0" dy="20.0">· context · signed records</tspan>
<tspan x="240.0" dy="20.0">· branch.json · public key</tspan>
</text>
<rect x="500" y="1180" width="320" height="140" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="660.0" y="1225.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="660.0" dy="0">Orchestrator store</tspan>
<tspan x="660.0" dy="20.0">MIRAI home, written by the CLI</tspan>
<tspan x="660.0" dy="20.0">run state · ticket status</tspan>
<tspan x="660.0" dy="20.0">· reviews · QA · 90-day retention</tspan>
</text>
<rect x="920" y="1180" width="320" height="140" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="1080.0" y="1225.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1080.0" dy="0">Trust root (launcher uses it)</tspan>
<tspan x="1080.0" dy="20.0">MIRAI home: copy of framework,</tspan>
<tspan x="1080.0" dy="20.0">config, rules from the</tspan>
<tspan x="1080.0" dy="20.0">integration branch, hash-checked</tspan>
</text>
<rect x="1340" y="1180" width="260" height="120" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="1470.0" y="1225.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1470.0" dy="0">Signing key</tspan>
<tspan x="1470.0" dy="20.0">~/.config/mirai/</tspan>
<tspan x="1470.0" dy="20.0">only you + CLI can read</tspan>
</text>
<rect x="1680" y="1180" width="360" height="140" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="1860.0" y="1225.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1860.0" dy="0">Hardened test containers</tspan>
<tspan x="1860.0" dy="20.0">compose from the trust root ·</tspan>
<tspan x="1860.0" dy="20.0">.git masked · no outside network</tspan>
<tspan x="1860.0" dy="20.0">· .env.test dummy secrets</tspan>
</text>
