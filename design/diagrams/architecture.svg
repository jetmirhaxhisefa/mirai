</defs><rect x="0" y="-240" width="2580" height="2070" fill="#ffffff"/>
<text x="80" y="-160" font-size="40" fill="#1e1e1e" text-anchor="start" font-weight="bold">
<tspan x="80" dy="0">MIRAI — the infrastructure (what talks to what)  (design v5, approved)</tspan>
</text>
<text x="80" y="-122" font-size="18" fill="#495057" text-anchor="start">
<tspan x="80" dy="0">Scripts decide, agents write. Every agent run goes through one launcher, inside the blocking layers. Agents reach MIRAI only through the MCP broker. Only scripts and you touch git history.</tspan>
</text>
<rect x="40" y="-90" width="2500" height="220" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="56" y="-54" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
<tspan x="56" dy="0">You</tspan>
</text>
<rect x="80" y="-40" width="320" height="120" rx="12" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="240.0" y="-4.4" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="240.0" dy="0">Your terminal</tspan>
<tspan x="240.0" dy="20.0">mirai inbox · approve · unpark</tspan>
<tspan x="240.0" dy="20.0">· run · resume · feedback</tspan>
<tspan x="240.0" dy="20.0">· handover · show · clean</tspan>
</text>
<rect x="500" y="-40" width="320" height="120" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="660.0" y="-4.4" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="660.0" dy="0">Claude Code (interactive)</tspan>
<tspan x="660.0" dy="20.0">/mirai-new · /mirai-prd …</tspan>
<tspan x="660.0" dy="20.0">same rules, but asks before</tspan>
<tspan x="660.0" dy="20.0">anything outside the project</tspan>
</text>
<rect x="920" y="-40" width="300" height="120" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="1070.0" y="5.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1070.0" dy="0">Git host (GitHub)</tspan>
<tspan x="1070.0" dy="20.0">you review + merge MRs</tspan>
<tspan x="1070.0" dy="20.0">CI runs on every MR</tspan>
</text>
<rect x="1340" y="-40" width="260" height="110" rx="12" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
<text x="1470.0" y="0.5999999999999996" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1470.0" dy="0">Morning report</tspan>
<tspan x="1470.0" dy="20.0">MRs · parked · pauses</tspan>
<tspan x="1470.0" dy="20.0">· usage · inbox</tspan>
</text>
<rect x="1680" y="-40" width="380" height="120" rx="12" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="1870.0" y="5.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1870.0" dy="0">Optional tracker / docs tool</tspan>
<tspan x="1870.0" dy="20.0">ClickUp · Jira · Linear · Confluence</tspan>
<tspan x="1870.0" dy="20.0">(one place per artifact type)</tspan>
</text>
<rect x="40" y="190" width="2500" height="330" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="56" y="226" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
<tspan x="56" dy="0">mirai CLI  (Node, zero dependencies, deterministic — no AI inside; runs as you, outside the sandbox)</tspan>
</text>
<rect x="80" y="260" width="300" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="230.0" y="305.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="230.0" dy="0">Orchestrator  mirai run</tspan>
<tspan x="230.0" dy="20.0">state machine per ticket</tspan>
<tspan x="230.0" dy="20.0">plan -&gt; build -&gt; checks -&gt; E2E</tspan>
<tspan x="230.0" dy="20.0">-&gt; review -&gt; QA -&gt; ship</tspan>
</text>
<rect x="420" y="260" width="260" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="550.0" y="305.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="550.0" dy="0">Loop guard</tspan>
<tspan x="550.0" dy="20.0">rounds · budgets (turns,</tspan>
<tspan x="550.0" dy="20.0">tokens, minutes) · repeat</tspan>
<tspan x="550.0" dy="20.0">failure · parking · pauses</tspan>
</text>
<rect x="720" y="260" width="280" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="860.0" y="305.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="860.0" dy="0">Agent launcher</tspan>
<tspan x="860.0" dy="20.0">claude -p, subscription token</tspan>
<tspan x="860.0" dy="20.0">--settings strict.json</tspan>
<tspan x="860.0" dy="20.0">--strict-mcp-config · dontAsk</tspan>
</text>
<rect x="1040" y="260" width="280" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1180.0" y="305.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1180.0" dy="0">MIRAI MCP broker</tspan>
<tspan x="1180.0" dy="20.0">agents' only way in, no shell</tspan>
<tspan x="1180.0" dy="20.0">run_tests · run_check</tspan>
<tspan x="1180.0" dy="20.0">· launch · log · lint · trace</tspan>
</text>
<rect x="1360" y="260" width="260" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1490.0" y="315.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1490.0" dy="0">Lints + mirai trace</tspan>
<tspan x="1490.0" dy="20.0">sections · ids · graph</tspan>
<tspan x="1490.0" dy="20.0">· AC -&gt; test -&gt; evidence</tspan>
</text>
<rect x="1660" y="260" width="280" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1800.0" y="305.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="1800.0" dy="0">Gate + signed records</tspan>
<tspan x="1800.0" dy="20.0">Ed25519 · normalized patch hash</tspan>
<tspan x="1800.0" dy="20.0">· secret scan · commits with</tspan>
<tspan x="1800.0" dy="20.0">Mirai-Ticket trailer</tspan>
</text>
<rect x="1980" y="260" width="260" height="140" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="2110.0" y="315.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="2110.0" dy="0">Connectors</tspan>
<tspan x="2110.0" dy="20.0">repo store (MVP)</tspan>
<tspan x="2110.0" dy="20.0">+ one contract for tools</tspan>
</text>
