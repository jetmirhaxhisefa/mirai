<rect x="40" y="610" width="2500" height="360" rx="12" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="8 6"/>
<text x="56" y="646" font-size="26" fill="#343a40" text-anchor="start" font-weight="bold">
<tspan x="56" dy="0">Agents — launched one at a time, as your user, inside the blocking layers   (thin personas; behavior lives in skills; model tier per step)</tspan>
</text>
<rect x="80" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="220.0" y="740.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="220.0" dy="0">Nora</tspan>
<tspan x="220.0" dy="20.0">product manager</tspan>
<tspan x="220.0" dy="20.0">brief · PRD</tspan>
</text>
<rect x="420" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="560.0" y="740.6" font-size="16" fill="#1e1e1e" text-anchor="middle">
<tspan x="560.0" dy="0">Arlo</tspan>
<tspan x="560.0" dy="20.0">architect</tspan>
<tspan x="560.0" dy="20.0">HLD · ADR · LLD</tspan>
</text>
<rect x="760" y="700" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
