# Secret shapes the hook refuses in what an agent writes (unit 13c; research/09 §7.6). Always on:
# private keys, and the tokens of services any project may use whatever its stack (a token for a
# code host, a cloud, a chat tool, a payment provider or a package registry). Only shapes with a
# fixed prefix, so ordinary code doesn't trip them; a known false alarm is a key or token pasted
# as a test fixture (the refusal tells the agent to use a placeholder or make it at test time).
# Packs add their own later (unit 17). The login token itself is matched exactly, in every
# encoding, from ~/.config/mirai (src/sign/token.js), not by a shape here.
kind = "secrets"
schema_version = 1
name = "core"

[[patterns]]
name = "private-key"
regex = "-----BEGIN [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----"

[[patterns]]
name = "aws-access-key"
regex = "\\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b"

[[patterns]]
name = "github-token"
regex = "\\bgh[pousr]_[A-Za-z0-9]{36,255}\\b"

[[patterns]]
name = "github-fine-grained-token"
regex = "\\bgithub_pat_[A-Za-z0-9_]{60,255}\\b"

[[patterns]]
name = "anthropic-key"
regex = "\\bsk-ant-[A-Za-z0-9_-]{20,255}"

[[patterns]]
name = "openai-key"
regex = "\\bsk-proj-[A-Za-z0-9_-]{20,255}"

[[patterns]]
name = "slack-token"
regex = "\\bxox[abprs]-[A-Za-z0-9-]{10,255}"

[[patterns]]
name = "google-api-key"
regex = "\\bAIza[0-9A-Za-z_-]{35}\\b"

[[patterns]]
name = "stripe-live-key"
regex = "\\b[sr]k_live_[0-9A-Za-z]{20,255}\\b"

[[patterns]]
name = "npm-token"
regex = "\\bnpm_[A-Za-z0-9]{36}\\b"

[[patterns]]
name = "gitlab-token"
regex = "\\bglpat-[A-Za-z0-9_-]{20,255}"
