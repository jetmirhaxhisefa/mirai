# The models MIRAI knows for each tool (unit 45b; Jet's answer 1 "D", 2026-11-25). `mirai models set`
# refuses a model on none of a tool's lists, unless `--check` proves it with one tiny real call.
# Claude Code has no command that lists full model IDs, so the full IDs are MIRAI's own list, updated
# with MIRAI's releases. Cursor's and Codex's lists come live from their CLIs (units 71 and 73).
kind = "models"
schema_version = 1

[claude-code]
# Full IDs, pinned: what MIRAI's defaults, probes and red-team results are measured on.
models = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5", "claude-fable-5-2", "claude-fable-5-1"]
# Claude Code's aliases, which `mirai models set` refuses (Jet's answer, 2026-11-26, "A"): an alias
# moves to the newest model of its kind, and every launch checks that the model Claude Code runs is
# exactly the one asked for (src/launch/strict.js), so an alias could be set but never launched.
# They're listed so the refusal can name the full ID to use instead.
aliases = ["haiku", "sonnet", "opus", "fable", "best", "default", "opusplan"]
