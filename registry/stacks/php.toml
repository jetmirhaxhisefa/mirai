# The php stack (unit 17a): PHP projects with a composer.json. Setup detection (mirai detect)
# proposes its pack and these named checks; nothing here runs by itself.
kind = "stack"
schema_version = 1
name = "php"
description = "PHP, with a composer.json"
markers = ["composer.json"]
pack = "php"

# A Composer script with one of these names becomes a named check. Not "format" or "cs": those
# usually fix files, and a check that fixes what it checks always passes.
[[checks]]
file = "composer.json"
field = "scripts"
names = ["lint", "analyse", "analyze"]
command = ["composer", "run-script", "{script}"]

# Tools that only check when asked to: Pint's --test changes nothing.
[[checks]]
package = { file = "composer.json", fields = ["require-dev", "require"], name = "laravel/pint" }
name = "format"
command = ["vendor/bin/pint", "--test"]

[[checks]]
package = { file = "composer.json", fields = ["require-dev", "require"], name = "phpstan/phpstan" }
name = "static-analysis"
command = ["vendor/bin/phpstan", "analyse", "--no-progress"]

# How a command runs a Composer script (unit 36): the project lint checks that composer.json lists it.
[[scripts]]
file = "composer.json"
field = "scripts"
command = ["composer", "run-script", "{script}"]

[[scripts]]
file = "composer.json"
field = "scripts"
command = ["composer", "run", "{script}"]

# Where dependencies are declared (unit 21b): a plan declares a new one as composer:<name>.
[[dependencies]]
file = "composer.json"
fields = ["require", "require-dev"]
ecosystem = "composer"
locks = ["composer.lock"]
sources = ["repositories", "replace", "provide", "conflict", "minimum-stability", "prefer-stable"]

# How MIRAI installs an approved one (unit 30b): as node's. `registry` for Composer is Packagist's
# download notification address, which every package resolved from Packagist carries in the lock
# (its files then come from where Packagist points, usually GitHub).
[dependencies.install]
command = ["composer", "require", "--no-install", "--no-scripts", "--no-plugins", "--no-interaction"]
package = "{name}:{version}"
lock = "composer.lock"
dev = ["--dev"]
dev_field = "require-dev"
lock_format = "composer"
registry = "https://packagist.org/downloads/"
image_install = ['\bcomposer\s+install\b[^\n]*--no-scripts']

# Commit-message rules (G8): CaptainHook's or GrumPHP's.
[[commit_rules]]
file = "captainhook.json"
contains = "commit-msg"

[[commit_rules]]
file = "grumphp.yml"
contains = "git_commit_message"
