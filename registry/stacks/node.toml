# The node stack (unit 17a): JavaScript and TypeScript projects with a package.json. Setup
# detection (mirai detect) proposes its pack and these named checks; nothing here runs by itself.
kind = "stack"
schema_version = 1
name = "node"
description = "JavaScript and TypeScript, with a package.json"
markers = ["package.json"]
pack = "node"

# A package script with one of these names becomes a named check, run through npm. Not "format":
# it usually fixes files ("format:check" doesn't). A build writes only into the run's copy.
[[checks]]
file = "package.json"
field = "scripts"
names = ["lint", "typecheck", "type-check", "types", "format:check", "build"]
command = ["npm", "run", "{script}"]

# How a command runs a package script (unit 36): the project lint checks that the script is in
# package.json, so `npm run nope` fails. npm's own shorthands only for the scripts it runs that way.
[[scripts]]
file = "package.json"
field = "scripts"
command = ["npm", "run", "{script}"]

[[scripts]]
file = "package.json"
field = "scripts"
command = ["npm", "run-script", "{script}"]

[[scripts]]
file = "package.json"
field = "scripts"
command = ["npm", "{script}"]
names = ["test", "start", "stop", "restart"]

[[scripts]]
file = "package.json"
field = "scripts"
command = ["pnpm", "run", "{script}"]

[[scripts]]
file = "package.json"
field = "scripts"
command = ["yarn", "run", "{script}"]

# Where dependencies are declared (unit 21b): a plan declares a new one as npm:<name>.
[[dependencies]]
file = "package.json"
fields = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"]
ecosystem = "npm"
locks = ["package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
sources = ["overrides", "resolutions", "bundleDependencies", "bundledDependencies", "pnpm", "workspaces"]

# How MIRAI installs an approved one (unit 30b): the lockfile update in a scratch folder holding only
# the manifest and its lock, in the service's own image, with network and install scripts off;
# the lock's format; where every resolved package must come from; and the line a Dockerfile must
# install with, so the per-ticket image is built with scripts off too.
[dependencies.install]
command = ["npm", "install", "--package-lock-only", "--save-exact", "--ignore-scripts", "--no-audit", "--no-fund"]
package = "{name}@{version}"
lock = "package-lock.json"
dev = ["--save-dev"]
dev_field = "devDependencies"
lock_format = "npm"
registry = "https://registry.npmjs.org/"
image_install = ['\bnpm\s+(ci|install)\b[^\n]*--ignore-scripts']

# Commit-message rules (G8): commitlint's config files, or a package.json that names it, and a
# hook manager's commit-msg hook.
[[commit_rules]]
file = "commitlint.config.js"

[[commit_rules]]
file = "commitlint.config.cjs"

[[commit_rules]]
file = "commitlint.config.mjs"

[[commit_rules]]
file = "commitlint.config.ts"

[[commit_rules]]
file = ".commitlintrc"

[[commit_rules]]
file = ".commitlintrc.json"

[[commit_rules]]
file = ".commitlintrc.yml"

[[commit_rules]]
file = ".commitlintrc.yaml"

[[commit_rules]]
file = ".commitlintrc.js"

[[commit_rules]]
file = ".commitlintrc.cjs"

[[commit_rules]]
file = "package.json"
contains = "commitlint"

# Husky 4 kept its hooks in package.json.
[[commit_rules]]
file = "package.json"
contains = "commit-msg"

[[commit_rules]]
file = "lefthook.yml"
contains = "commit-msg"

[[commit_rules]]
file = ".lefthook.yml"
contains = "commit-msg"
