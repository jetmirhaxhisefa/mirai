# A bug: what is wrong, how to reproduce it, and how the fix is proven (design/01 §5). Its
# status lives in the store (D-06).
kind = "document-type"
schema_version = 1
name = "bug"
template = "templates/bug.md"
template_version = 2
checklist = "templates/bug-checklist.md"
status = "forbidden"
id_pattern = "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"
required_sections = ["Description", "Reproduction", "Acceptance criteria"]
optional_sections = ["Cause hypothesis", "References", "Notes"]
section_order = ["Description", "Reproduction", "Cause hypothesis", "Acceptance criteria", "References", "Notes"]
lint_checks = ["ticket"]
# Unit 42 (decision 2): a lone ticket, asked for by hand, is checked by Vera against its interview and
# the context files; a ticket of an epic is checked with its epic (src/verify/run.js).
verifier = true

# Unit 42: a lone ticket links the interview it was written from, right under its title.
[[upstream_link]]
label = "Interview"
type = "interview"
required = false

[frontmatter.fields.repo]
type = "string"
required = true

[frontmatter.fields.risk]
type = "enum"
values = ["normal", "high"]
required = true

[frontmatter.fields.size]
type = "enum"
values = ["S", "M", "L"]
required = true

[frontmatter.fields.verify]
type = "string"
required = true

[frontmatter.fields.covers_fr]
type = "list"
pattern = "N?FR-[0-9]+"

[frontmatter.fields.covers_ac]
type = "list"
pattern = "AC-N?FR-[0-9]+\\.[0-9]+"

[frontmatter.fields.governed_by]
type = "list"
pattern = "ADR-[0-9]+"

[frontmatter.fields.after]
type = "list"
pattern = "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"

[frontmatter.fields.epic]
type = "string"
pattern = "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"

[frontmatter.fields.files_likely]
type = "list"
pattern = "(?![A-Za-z]:)(?!/)(?! )(?!.*(?:^|/)\\.\\.(?:/|$))(?!.* $)[^\\\\\\u0000-\\u001f]+"

# Unit 42 (decisions 5 and 6): the run's pick reads priority (Tess proposes, you set it at
# approval) and order (within the epic: the tracer bullet first); ticket_type names one of the
# project's [[tickets.types]] (Story, Bug and Investigation by default), whose runs_as must be this
# document's type.
[frontmatter.fields.priority]
type = "enum"
values = ["high", "normal", "low"]

[frontmatter.fields.order]
type = "integer"

[frontmatter.fields.ticket_type]
type = "string"
pattern = "[A-Za-z][A-Za-z0-9 ._-]{0,39}"

[frontmatter.fields.e2e]
type = "boolean"

[frontmatter.fields.tdd]
type = "enum"
values = ["auto", "first", "after"]

[frontmatter.fields.tests]
type = "enum"
values = ["required", "optional"]

# The ticket's own acceptance criteria, AC-<ticket>.n (R-M10), on every track.
[[ids]]
prefix = "AC"
pattern = "AC-{id}\\.[0-9]+"
defined_by = "bullet"
required = true
section = "Acceptance criteria"

# Unit 37: what MIRAI's machinery reads, which no overlay may drop (an overlay may rename one
# through its map). Each names what reads it.

[[protected_sections]]
name = "Acceptance criteria"
read_by = ["lint", "trace", "epic-coverage", "gate"]

[[protected_fields]]
name = "covers_fr"
read_by = ["epic-coverage", "graph-lint"]

[[protected_fields]]
name = "covers_ac"
read_by = ["epic-coverage", "graph-lint"]

[[protected_fields]]
name = "after"
read_by = ["graph-lint"]

[[protected_fields]]
name = "epic"
read_by = ["graph-lint", "epic-render"]

[[protected_fields]]
name = "risk"
read_by = ["gate"]

[[protected_fields]]
name = "size"
read_by = ["gate"]

[[protected_fields]]
name = "repo"
read_by = ["lint"]

# Unit 42: the run's pick (src/tickets/pick.js) and the ticket's type.
[[protected_fields]]
name = "priority"
read_by = ["run-pick", "lint"]

[[protected_fields]]
name = "order"
read_by = ["run-pick", "epic-render"]

[[protected_fields]]
name = "ticket_type"
read_by = ["lint", "gate"]
