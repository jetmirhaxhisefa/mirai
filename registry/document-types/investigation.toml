# An investigation (unit 42, decisions 6 and 7): a ticket whose work is research and a written
# finding, with no code merge. The project's ticket types with `runs_as = "investigation"` (Spike,
# Investigation) are written as this type. Running one (the research run, the finding) is unit 42b;
# until it's built, MIRAI refuses to start one, with the reason. Its status lives in the store
# (D-06).
kind = "document-type"
schema_version = 1
name = "investigation"
template = "templates/investigation.md"
template_version = 1
checklist = "templates/investigation-checklist.md"
status = "forbidden"
id_pattern = "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"
required_sections = ["Question", "Acceptance criteria", "Sources"]
# "Looked at", "Finding" and "Next steps" are the investigation run's (42b): "Not applicable" until then.
optional_sections = ["Looked at", "Finding", "Next steps", "Notes"]
section_order = ["Question", "Acceptance criteria", "Looked at", "Finding", "Next steps", "Sources", "Notes"]
lint_checks = ["ticket"]

[[upstream_link]]
label = "Interview"
type = "interview"
required = false

[frontmatter.fields.repo]
type = "string"
required = true

[frontmatter.fields.risk]
type = "enum"
values = ["normal", "high"]
required = true

[frontmatter.fields.size]
type = "enum"
values = ["S", "M", "L"]
required = true

[frontmatter.fields.verify]
type = "string"
required = true

[frontmatter.fields.priority]
type = "enum"
values = ["high", "normal", "low"]

[frontmatter.fields.order]
type = "integer"

[frontmatter.fields.ticket_type]
type = "string"
pattern = "[A-Za-z][A-Za-z0-9 ._-]{0,39}"

[frontmatter.fields.covers_fr]
type = "list"
pattern = "N?FR-[0-9]+"

[frontmatter.fields.covers_ac]
type = "list"
pattern = "AC-N?FR-[0-9]+\\.[0-9]+"

[frontmatter.fields.after]
type = "list"
pattern = "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"

[frontmatter.fields.epic]
type = "string"
pattern = "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"

# What the finding must answer, AC-<ticket>.n, as a story's criteria.
[[ids]]
prefix = "AC"
pattern = "AC-{id}\\.[0-9]+"
defined_by = "bullet"
required = true
section = "Acceptance criteria"

# Unit 37: what MIRAI's machinery reads, which no overlay may drop.

[[protected_sections]]
name = "Question"
read_by = ["gate"]

[[protected_sections]]
name = "Acceptance criteria"
read_by = ["lint", "trace", "epic-coverage", "gate"]

[[protected_sections]]
name = "Finding"
read_by = ["gate"]

[[protected_sections]]
name = "Sources"
read_by = ["gate"]

[[protected_fields]]
name = "covers_fr"
read_by = ["epic-coverage", "graph-lint"]

[[protected_fields]]
name = "covers_ac"
read_by = ["epic-coverage", "graph-lint"]

[[protected_fields]]
name = "after"
read_by = ["graph-lint"]

[[protected_fields]]
name = "epic"
read_by = ["graph-lint", "epic-render"]

[[protected_fields]]
name = "risk"
read_by = ["gate"]

[[protected_fields]]
name = "size"
read_by = ["gate"]

[[protected_fields]]
name = "repo"
read_by = ["lint"]

[[protected_fields]]
name = "priority"
read_by = ["run-pick", "lint"]

[[protected_fields]]
name = "order"
read_by = ["run-pick", "epic-render"]

[[protected_fields]]
name = "ticket_type"
read_by = ["lint", "gate"]
