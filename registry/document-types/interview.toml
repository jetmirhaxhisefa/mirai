# An interview: the record of the questions an agent asked the owner, with every answer, the
# restatement and the owner's "yes" (unit 35; design/01 §3 step 1). It sits beside the brief, at
# docs/mirai/<initiative>/interview.md, and the brief links it in an "Interview:" line. It has no
# summary and no approval of its own: an interview that isn't confirmed blocks the brief's
# approval. The method is the `mirai-interview` skill.
kind = "document-type"
schema_version = 1
name = "interview"
template = "templates/interview.md"
template_version = 2
checklist = "templates/interview-checklist.md"
status = "forbidden"
required_sections = ["Questions", "Restatement"]
# Unit 44: the intake (/mirai-new, /mirai-prd: at most 2 questions and the track) and the
# look-ahead's assumptions (A-n, approved together), each only when there is one.
optional_sections = ["Intake", "Assumptions"]
section_order = ["Intake", "Questions", "Assumptions", "Restatement"]
# A paused interview has no restatement yet.
may_be_empty = ["Restatement", "Assumptions"]
# Unit 44: left out entirely when the request has none (no "Not applicable" line).
may_be_absent = ["Intake", "Assumptions"]
lint_checks = ["interview"]

# open: questions are being asked; paused: the owner said "pause", or no one could be asked
# (autonomous mode); confirmed: every question answered, and the owner said "yes" to the
# restatement.
[frontmatter.fields.state]
type = "enum"
values = ["open", "paused", "confirmed"]
required = true

# Unit 42 (decision 2): an interview for one ticket asked for by hand (/mirai ticket) is short: at
# most 3 questions (TICKET_QUESTION_CAP, src/lint/interview.js). Unset: an initiative's interview.
[frontmatter.fields.for]
type = "enum"
values = ["initiative", "ticket"]

# Each question is a heading: "### Q-1: Who it's for".
[[ids]]
prefix = "Q"
pattern = "Q-[0-9]+"
defined_by = "heading"
required = true
section = "Questions"

# Unit 37: what MIRAI's machinery reads, which no overlay may drop (an overlay may rename one
# through its map). Each names what reads it.

[[protected_sections]]
name = "Questions"
read_by = ["lint", "gate", "trace"]

[[protected_sections]]
name = "Restatement"
read_by = ["lint", "gate"]

[[protected_fields]]
name = "state"
read_by = ["gate"]
