# A business brief: the first document of a feature (design/01 §2, U4). Written by the product
# manager (Nora), checked by the verifier (Vera), approved by you: on `standard` together with
# the PRD, on `full` at its own gate. Its status lives in the store (D-06).
# Unit 31 (PM-03; research/13 §9a–§9b): the summary for approval on top, then Lenny Rachitsky's
# 1-pager plus Basecamp Shape Up's appetite, no-gos and rabbit holes. The wording is MIRAI's own.
kind = "document-type"
schema_version = 1
name = "brief"
template = "templates/brief.md"
template_version = 1
checklist = "templates/brief-checklist.md"
status = "forbidden"
required_sections = ["Summary for approval", "Problem", "Who it is for", "Why now", "Success", "Business requirements", "Appetite and track", "No-gos", "Sources", "Open questions"]
optional_sections = ["Rabbit holes", "Hard questions"]
section_order = ["Summary for approval", "Problem", "Who it is for", "Why now", "Success", "Business requirements", "Appetite and track", "No-gos", "Rabbit holes", "Hard questions", "Sources", "Open questions"]
may_be_empty = ["Open questions"]
summary_words = 400
lint_checks = ["summary", "writing", "brief"]
# Unit 40 (decision 6): Vera checks this type before you approve it; its checklist marks her
# lines with [vera], and a checklist with none fails the registry check.
verifier = true

# Unit 35: the line under the title that links the interview the brief came from, when the
# request was thin: "Interview: [<its title>](interview.md)". Optional; an interview.md beside
# the brief that the brief doesn't link fails, and so does a linked one that isn't confirmed.
[[upstream_link]]
label = "Interview"
required = false

[frontmatter.fields.track]
type = "enum"
values = ["quick", "standard", "full"]
required = true

# Success metrics: a table row whose first cell is SM-n.
[[ids]]
prefix = "SM"
pattern = "SM-[0-9]+"
defined_by = "table"
required = true
section = "Success"

# Business requirements: outcomes the business needs (the start of the ID chain, design/01 §5a).
[[ids]]
prefix = "BR"
pattern = "BR-[0-9]+"
defined_by = "bullet"
required = true
section = "Business requirements"

[[ids]]
prefix = "NG"
pattern = "NG-[0-9]+"
defined_by = "bullet"
required = true
section = "No-gos"

[[ids]]
prefix = "R"
pattern = "R-[0-9]+"
defined_by = "bullet"
section = "Rabbit holes"

[[ids]]
prefix = "Q"
pattern = "Q-[0-9]+"
defined_by = "bullet"
section = "Open questions"

# Unit 37: what MIRAI's machinery reads, which no overlay may drop (an overlay may rename one
# through its map). Each names what reads it.

[[protected_sections]]
name = "Summary for approval"
read_by = ["approval", "reader-test", "lint"]

[[protected_sections]]
name = "The ask"
read_by = ["approval", "lint"]

[[protected_sections]]
name = "Why"
read_by = ["approval", "lint"]

[[protected_sections]]
name = "What changes"
read_by = ["approval", "lint"]

[[protected_sections]]
name = "Decisions for you"
read_by = ["approval", "reader-test", "lint"]

[[protected_sections]]
name = "Not in this"
read_by = ["approval", "reader-test", "lint"]

[[protected_sections]]
name = "Success"
read_by = ["lint", "trace"]

[[protected_sections]]
name = "Business requirements"
read_by = ["lint", "trace"]

[[protected_sections]]
name = "Appetite and track"
read_by = ["lint", "gate"]

[[protected_sections]]
name = "No-gos"
read_by = ["trace"]

[[protected_sections]]
name = "Rabbit holes"
read_by = ["trace"]

[[protected_sections]]
name = "Open questions"
read_by = ["lint", "approval", "trace"]

[[protected_fields]]
name = "track"
read_by = ["gate", "approval", "reader-test"]

[[protected_fields]]
link = "Interview"
read_by = ["approval", "gate"]
